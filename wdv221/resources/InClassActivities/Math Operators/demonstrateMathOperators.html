<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demonstrate Math Operators</title>
  <style>div{margin: 10px 0;}</style>
</head>
<body>
  <form action="#">
    <label for="product">Product: </label>
    <select name="product" id="product">
      <option value="19.99">Portal</option>
      <option value="29.99">Portal 2</option>
      <option value="34.99">Half Life 2</option>
    </select>

    <div>
      <label for="quantity">Quantity: </label>
      <input type="text" name="quantity" id="quantity">
    </div>

    <button id="btnTotal">Calculate Total</button>
    <span id="totalOutput"></span>

    <div>
      <button id="btnRollDice">Roll Dice</button>
      <span id="diceRollOutput"></span>
    </div>

    <div>
      <input type="reset" value="Reset" id="btnReset">
    </div>
  </form>
</body>
</html>
