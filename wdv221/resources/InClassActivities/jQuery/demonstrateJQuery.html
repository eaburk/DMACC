  <style>
    body {

    <form id="rectangleForm">
      <label for="widthInput">Width:</label>

      <label for="heightInput">Height:</label>

      <button type="submit" id="calculateButton">Calculate</button>

      <p id="resultsDisplay"></p>
    </form>
