<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Built-in Objects Activity</title>

  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      margin: 40px;
    }

    section {
      border: 1px solid #999;
      padding: 20px;
      margin-bottom: 25px;
    }

    button {
      padding: 10px 20px;
      margin-top: 15px;
    }

    .output {
      font-size: 1.2em;
      margin-top: 15px;
    }
  </style>

  <script src="objects.js" defer></script>

</head>

<body>

  <h1>Working with Built-in Objects</h1>

  <section>

    <h2>String Object</h2>

    <p id="stringOutput"></p>

    <button id="stringBtn">
      Show String Methods
    </button>

  </section>

  <section>

    <h2>Style Object</h2>

    <p id="styleText">
      This text will change style.
    </p>

    <button id="styleBtn">
      Change Style
    </button>

  </section>

  <section>

    <h2>Date Object</h2>

    <p id="dateOutput"></p>

    <button id="dateBtn">
      Show Current Date
    </button>

  </section>

</body>

</html>
