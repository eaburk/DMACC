<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>National Park Entry Fee Lookup</title>
</head>

<body>
  <h1>National Park Entry Fee Lookup</h1>

  <form id="parkForm">
    <p>
      <label for="parkSelect">Select a national park:</label>

      <select id="parkSelect">
        <option value="">Choose a park</option>
      </select>
    </p>

    <p>
      Entry fee:
      <span id="displayFee"></span>
    </p>

    <button type="reset" id="resetButton">Reset</button>
  </form>
</body>
</html>
