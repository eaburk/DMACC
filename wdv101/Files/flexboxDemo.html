<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flexbox Demo</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    nav {
      display: flex;
      background-color: rgb(67, 64, 64);
    }
    nav ul {
      display: flex;
      list-style: none;
      justify-content: flex-end;
      align-items: flex-end;
      gap: 10px;
      width: 100%;
      padding-right: 5px;
    }

    nav ul a {
      text-decoration: none;
      color: rgb(223, 156, 11);
    }

    img {
      width: 50px;
    }
  </style>
</head>
<body>

      </ul>
  </nav>

</html>
