<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bootstrap Demo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <style>
    .container {
      border: 1px solid black;
    }
    .row {
      border: 1px solid red;
    }
    [class^='col'] {
      border: 1px solid green;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="row">
      <div class="col-2">Col 1</div>
      <div class="col-8">Col 2</div>
      <div class="col-2">Col 3</div>
    </div>

    <div class="row">
      <div class="col-sm-12 col-md-6 col-lg-4">Col 4</div>
      <div class="col-sm-12 col-md-6 col-lg-4">Col 5</div>
      <div class="col-sm-12 col-md-12 col-lg-4">Col 6</div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
