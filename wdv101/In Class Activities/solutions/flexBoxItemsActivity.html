<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flexbox Item Playground Solution</title>

<style>

body{
    font-family: Arial, Helvetica, sans-serif;
    background:#f5f5f5;
    margin:40px;
}

h1{
    text-align:center;
}

.container{
    display:flex;

    width:900px;
    height:300px;

    margin:30px auto;

    border:4px solid black;
    background:white;

    justify-content:center;
    align-items:center;
    gap:10px;
}

/* Flex item styles */

.box{
    background:#3b82f6;
    color:white;
    font-size:2rem;
    font-weight:bold;

    width:100px;
    height:100px;

    display:flex;
    justify-content:center;
    align-items:center;
}


/**********************************************/
/* PART 1 - ORDER                              */
/**********************************************/

.item5{
    order:-2;
}

.item3{
    order:-1;
}

.item1{
    order:5;
}


/**********************************************/
/* PART 2 - FLEX GROW                         */
/**********************************************/

.item1{
    flex-grow:1;
}

.item2{
    flex-grow:2;
}

.item3{
    flex-grow:3;
}

.item4{
    flex-grow:4;
}

.item5{
    flex-grow:5;
}


/**********************************************/
/* PART 3 - FLEX BASIS                        */
/**********************************************/

.box{
    flex-basis:100px;
}


/**********************************************/
/* PART 4 - FLEX SHRINK                       */
/**********************************************/

/*
Change container width to 500px
and Box 3 will not shrink.
*/

.container{
    width:500px;
}

.item3{
    flex-shrink:0;
}


/**********************************************/
/* PART 5 - ALIGN SELF                        */
/**********************************************/

.item4{
    align-self:flex-end;
}


</style>

</head>
<body>

<h1>Flexbox Item Playground Solution</h1>

<div class="container">

    <div class="box item1">1</div>
    <div class="box item2">2</div>
    <div class="box item3">3</div>
    <div class="box item4">4</div>
    <div class="box item5">5</div>

</div>

</body>
</html>
